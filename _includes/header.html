<header class="site-head">
  <div class="wrap site-head__inner">
    <a class="brand" href="{{ '/' | relative_url }}">
      <span class="brand__name">{{ site.title }}</span>
      {%- if site.tagline %}<span class="brand__tagline">{{ site.tagline }}</span>{% endif -%}
    </a>

    <nav class="nav" aria-label="Navegação principal">
      {%- assign p = page.url -%}
      <a href="{{ '/' | relative_url }}" {% if p == '/' %}aria-current="page"{% endif %}>Artigos</a>
      <a href="{{ '/tags/' | relative_url }}" {% if p contains '/tags' %}aria-current="page"{% endif %}>Tags</a>
      <a href="{{ '/livros/' | relative_url }}" {% if p contains '/livros' %}aria-current="page"{% endif %}>Livros</a>
      <a href="{{ '/ferramentas/' | relative_url }}" {% if p contains '/ferramentas' %}aria-current="page"{% endif %}>Ferramentas</a>
      <a href="{{ '/sobre/' | relative_url }}" {% if p contains '/sobre' %}aria-current="page"{% endif %}>Sobre</a>
      {%- for s in site.social %}{% if s.name == 'GitHub' %}
      <a href="{{ s.url }}" class="nav__icone" rel="me noopener"
         aria-label="Perfil no GitHub" title="GitHub">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false">
          <path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.6 7.6 0 0 1 2-.27c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
        </svg>
      </a>
      {%- endif %}{% endfor %}
      <a href="{{ '/feed.xml' | relative_url }}" class="nav__rss" title="Assinar o RSS">
        <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" focusable="false">
          <circle cx="6.2" cy="17.8" r="2.2" fill="currentColor"/>
          <path d="M4 10.2a9.8 9.8 0 0 1 9.8 9.8" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"/>
          <path d="M4 4.2A15.8 15.8 0 0 1 19.8 20" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"/>
        </svg>
        <span>RSS</span>
      </a>
      <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Alternar tema claro e escuro" title="Alternar tema">
        <svg class="icon-sun" viewBox="0 0 24 24" width="17" height="17" aria-hidden="true" focusable="false">
          <circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="1.7"/>
          <g stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
            <path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6"/>
          </g>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" width="17" height="17" aria-hidden="true" focusable="false">
          <path d="M20.5 14.2A8.6 8.6 0 0 1 9.8 3.5a8.6 8.6 0 1 0 10.7 10.7z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
        </svg>
      </button>
    </nav>
  </div>
</header>
