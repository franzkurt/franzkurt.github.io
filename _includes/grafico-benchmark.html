<script>
(function () {
  var fig = document.currentScript.previousElementSibling;
  var svg = fig.querySelector("svg"), tip = fig.querySelector(".viz__tooltip");
  var mira = fig.querySelector(".viz__mira"), linha = mira.querySelector("line");
  var dados = [{"t": 1, "v": [0.72, 0.6, 0.69]}, {"t": 2, "v": [0.75, 0.62, 0.64]}, {"t": 4, "v": [0.74, 0.43, 0.66]}, {"t": 8, "v": [0.72, 0.27, 0.65]}], nomes = ["3.14 com GIL", "3.14t sem GIL", "3.14t GIL religado"], slots = ["s1", "s2", "s3"], xs = [46.0, 200.0, 354.0, 508.0], larguraSvg = 640;
  function mostrar(alvo) {
    var i = +alvo.dataset.i, d = dados[i];
    linha.setAttribute("x1", xs[i]); linha.setAttribute("x2", xs[i]);
    mira.classList.add("viz__mira--on");
    tip.innerHTML = "<strong>" + d.t + (d.t > 1 ? " threads" : " thread") + "</strong>" +
      nomes.map(function (nome, k) {
        return "<span class=\"viz__tl\"><span class=\"viz__marca viz__marca--" + slots[k] +
               "\"></span>" + nome + "<b>" + d.v[k].toFixed(2).replace(".", ",") + " s</b></span>";
      }).join("");
    var cx = svg.getBoundingClientRect(), cf = fig.getBoundingClientRect();
    var px = cx.left - cf.left + (xs[i] / larguraSvg) * cx.width;
    tip.hidden = false;
    tip.style.left = Math.min(Math.max(px - tip.offsetWidth / 2, 0),
                              fig.clientWidth - tip.offsetWidth) + "px";
  }
  fig.querySelectorAll(".viz__alvo").forEach(function (alvo) {
    ["mouseenter", "mousemove", "focus"].forEach(function (ev) {
      alvo.addEventListener(ev, function () { mostrar(alvo); });
    });
  });
  function esconder() { tip.hidden = true; mira.classList.remove("viz__mira--on"); }
  fig.querySelector(".viz__plot").addEventListener("mouseleave", esconder);
  fig.addEventListener("focusout", function (e) {
    if (!fig.contains(e.relatedTarget)) esconder();
  });
})();
</script>
